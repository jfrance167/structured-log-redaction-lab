name: Tests and Bandit
on:
  push:
    branches: [main, codex/structured-log-redaction-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python -m log_minimizer --evaluate
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m bandit -r log_minimizer scripts
